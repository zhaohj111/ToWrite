[package]
name = "towrite"
version = "0.6.4"
description = "拓文 / ToWrite - AI 协作文学写作工具"
# authors 用于 .deb 包的 Maintainer 字段（要求"姓名 <邮箱>"格式；改用 zhaohj111 的 GitHub noreply 邮箱）
authors = ["ToWrite <zhaohj111@users.noreply.github.com>"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "towrite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", features = ["deflate"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
# 更新检查：GitHub Releases API + 安装包下载。native-tls（Windows 走 schannel，零额外工具链）；
# 不用 0.13 默认（rustls/aws-lc-rs，Windows 需 CMake+NASM）。chunk() 流式下载，无需 stream/futures-util。
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls"] }
# 文本/图片型 PDF 导出（0.8.x：ParsedFont::from_bytes + doc.add_font，TTC 字体集合按索引取字面）。
# 需显式开启 png feature：图片型 PDF 由前端 html-to-image 渲染成 PNG，Rust 侧 RawImage::decode_from_bytes
# 依赖 image/png 解码，默认 features 只有 html，未开 png 会直接报「missing feature 'png'」导致导出静默失败。
printpdf = { version = "0.8", features = ["png"] }
# 二进制文件读写（导入 PDF/DOCX/EPUB、导出 PNG）以 base64 字符串在前后端间传递
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
# 读取卸载注册表区分 MSI / NSIS 安装方式，决定更新下载 exe 还是 msi（仅 Windows）
winreg = "0.52"

[profile.dev]
incremental = true
